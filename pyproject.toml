[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-image-compress"
version = "1.0.0"
description = "Compress images below model upload limits and avoid HTTP 413 Payload Too Large."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "柠檬酱277" }]
keywords = ["codex", "image", "compression", "webp", "413", "pillow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/miku1130/codex-image-compress"
Issues = "https://github.com/miku1130/codex-image-compress/issues"

[project.scripts]
image-compress = "image_compress:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["image_compress"]
